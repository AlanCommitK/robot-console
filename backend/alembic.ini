# Alembic 配置。数据库地址不写在这里：alembic/env.py 从环境变量 DATABASE_URL 读取，
# 和应用本身用的是同一个配置来源（app.config.Settings）。

[alembic]
script_location = alembic
# 把当前目录（backend/）放进 sys.path，env.py 才能 import app.models / app.config。
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
