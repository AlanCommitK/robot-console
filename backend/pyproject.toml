# 这里只放工具配置（ruff + pytest）；依赖版本在 requirements*.txt 里钉死。

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    # 中文注释/文档字符串里的全角标点（，：（））会被当成"易混淆的 Unicode 字符"，这里关掉。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/ 下有一个同名的 alembic/ 迁移目录，不声明的话 ruff 会把 alembic 库误判成本项目代码。
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 把 backend/ 加进 sys.path，测试里才能 `import app`（不管从哪个目录启动 pytest）。
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real PostgreSQL/Redis/RabbitMQ; runs only when RUN_INTEGRATION=1",
]
filterwarnings = [
    # Starlette 1.7 的 TestClient 建议改用 httpx2；httpx 仍然完全可用，这条提示与本项目无关。
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]
