# =============================================================================
# robot-console 的 Nginx 配置（SPEC §16）
#
# 这是一份“完整”的 nginx.conf，Dockerfile 会用它整个替换镜像里的 /etc/nginx/nginx.conf，
# 所以从头到尾每一层（main → events → http → upstream/server → location）都在这一个文件里，可以从上往下按层级阅读。
#
# Nginx 在本项目里同时扮演三个角色：
#   1. 静态文件服务器：托管 React 打包出来的单页应用（SPA）；
#   2. 反向代理：浏览器只访问 Nginx 一个地址（http://localhost:8080），/api/ 和 /ws/ 由它转给后端；
#   3. 负载均衡器：后端有 api-1、api-2 两个副本，Nginx 轮流分配请求，一个挂了自动切到另一个。
#
# 改完配置可以在容器里用 `nginx -t` 检查语法，`nginx -s reload` 平滑重载（不断开现有连接）。
# =============================================================================

# worker 进程以 nginx 用户运行；master 进程需要 root 才能绑定 80 端口，然后把真正干活的 worker 降权
user  nginx;
# worker 进程数 = CPU 核数。Nginx 是事件驱动的，每个 worker 单线程就能处理成千上万个连接
worker_processes  auto;

# 官方镜像把 error.log / access.log 软链接到了容器的 stderr / stdout，所以 `docker compose logs nginx` 能直接看到
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # 每个 worker 最多同时持有的连接数。注意反向代理时一个请求占两个连接（客户端一侧 + 后端一侧），
    # WebSocket 是长连接，会一直占着
    worker_connections  1024;
}

http {
    # 按文件扩展名设置 Content-Type（.js → application/javascript，.css → text/css ……）
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 不在响应头和错误页里暴露 Nginx 的具体版本号，减少被针对性攻击的信息
    server_tokens off;

    # ---------------------------------------------------------------------
    # map：根据一个变量的值计算出另一个变量（在 http 层定义，在用到时才求值）
    # ---------------------------------------------------------------------

    # WebSocket 握手需要转发 “Connection: upgrade”。
    # 浏览器发起 WebSocket 时会带 Upgrade: websocket 请求头 → $connection_upgrade = "upgrade"；
    # 普通请求没有 Upgrade 头 → $connection_upgrade = "close"。
    # 为什么不能直接透传：Connection 和 Upgrade 是“逐跳（hop-by-hop）”头，HTTP 规定代理不能把它们原样转发，
    # 必须由代理自己决定要不要对下一跳也发起协议升级，所以要显式地写 proxy_set_header。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 请求 ID：客户端带了 X-Request-ID 就沿用；没带就用 Nginx 自动生成的 $request_id（32 位十六进制随机串）。
    # 这个 ID 会传给后端，后端写进它自己的日志并在响应里回显——同一个请求在 Nginx 日志和 API 日志里能对上号
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    # ---------------------------------------------------------------------
    # 访问日志
    # ---------------------------------------------------------------------

    # $upstream_addr 记录这个请求实际被转给了哪个后端（IP:端口），$request_time 是总耗时，
    # $upstream_response_time 是后端处理耗时，两者之差就是花在 Nginx 和网络上的时间
    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time '
                      'req_id=$req_id "$http_user_agent"';

    # WebSocket 专用格式：只记录 $uri（不含查询参数），访问日志更短；rt= 是这条连接存活了多久
    # （WebSocket 的这一行日志要等连接断开时才会写出）。
    #
    # 注意：这并不能保证查询参数不进日志。上游出错时（副本挂了、连接被拒），error_log 会写出完整的
    # 请求行和转发地址，例如 request: "GET /ws/dashboard?ticket=... HTTP/1.1"——它不受 log_format 控制。
    # 所以 URL 里从来不放长期有效的凭证：
    #   - 机器人的 token 放在 Authorization 请求头里，Nginx 的两种日志都不记录请求头；
    #   - 浏览器看板放的是一次性票据（ticket）：它在建立连接时就被服务端从 Redis 里取走删除（只能用一次），
    #     没被用掉的也会在 30 秒后自动作废。日志里看到的票据要么已经用过，要么很快失效，
    #     而且它最多只能换来一条只读的看板推送连接——不像 JWT 那样能拿去调用接口、有效好几个小时。
    log_format  ws    '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status '
                      'rt=$request_time upstream=$upstream_addr req_id=$req_id';

    access_log  /var/log/nginx/access.log  main;

    # 发送静态文件时让内核直接把文件数据拷到 socket（零拷贝），并尽量把响应头和文件开头合成一个 TCP 包
    sendfile        on;
    tcp_nopush      on;
    # 浏览器和 Nginx 之间的 HTTP keep-alive 连接空闲 65 s 后关闭
    keepalive_timeout  65;

    # ---------------------------------------------------------------------
    # gzip：对文本类资源压缩后再传输。JS/CSS 通常能压到原来的 1/3 左右
    # ---------------------------------------------------------------------
    gzip              on;
    # 压缩级别 1~9：越高越省流量也越费 CPU，5 左右性价比最好
    gzip_comp_level   5;
    # 太小的响应压缩不划算（gzip 本身有头部开销）
    gzip_min_length   1024;
    # text/html 默认就会压缩，不用写；application/json 会让 /api/ 的 JSON 响应也顺带被压缩
    gzip_types        text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    # 响应头加 “Vary: Accept-Encoding”，告诉中间的缓存：压缩版和未压缩版要分开存
    gzip_vary         on;
    # 请求经过了其他代理（带 Via 头）时也照样压缩
    gzip_proxied      any;

    # ---------------------------------------------------------------------
    # upstream：后端服务器组，名字 api_upstream 会在下面的 proxy_pass 里引用
    # ---------------------------------------------------------------------
    # 默认算法是轮询（round robin）：第 1 个请求给 api-1，第 2 个给 api-2，依此类推。
    # 能随便轮询的前提是副本“无状态”：登录态在 JWT 里，数据在 PostgreSQL，实时事件经 Redis 广播，
    # 命令在 RabbitMQ 里——任何一个副本都能处理任何一个请求。
    #
    # max_fails=2 fail_timeout=10s：10 s 内对某个副本失败 2 次，就把它标记为不可用并在接下来 10 s 内跳过它，
    # 10 s 后再放一个请求过去试探。什么算“失败”由下面的 proxy_next_upstream 决定。
    #
    # 注意：api-1、api-2 是 Docker Compose 网络里的主机名。普通写法下 Nginx 只在【启动时】解析一次 DNS，
    # 之后一直用当时拿到的 IP；而 `docker compose up -d --force-recreate api-1` 会让容器换一个新 IP，
    # Nginx 就会继续往旧 IP 发、直到它自己被重启——经典的“Nginx DNS 缓存”坑。
    # 这里用 server ... resolve（开源版 Nginx 从 1.27.3 起支持）：配合 upstream 里的 resolver
    # （127.0.0.11 是 Docker 内置 DNS 的固定地址），每隔 valid= 指定的时间重新解析一次，
    # 容器重建后几秒内自动切到新 IP；启动时某个主机名暂时解析不到也不会让 Nginx 启动失败。
    # 代价：Nginx 的 resolver 不读 /etc/hosts，只问 DNS 服务器，所以这份配置只能在 compose 网络里正常转发。
    upstream api_upstream {
        # 共享内存区：让所有 worker 进程共用同一份“轮询位置”和“失败计数”。
        # 没有它时每个 worker 各算各的——轮询顺序看起来是乱的（1,1,2,1…），
        # 而且一个副本挂掉后，每个 worker 都要各自踩一次坑才知道它挂了。resolve 也要求必须有它。
        zone api_upstream 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server api-1:8000 max_fails=2 fail_timeout=10s resolve;
        server api-2:8000 max_fails=2 fail_timeout=10s resolve;
    }

    server {
        # 容器内监听 80，docker compose 把它映射到宿主机的 8080
        listen       80;
        server_name  _;

        # 前端打包产物（npm run build 生成的 dist/）在镜像里的位置
        root   /usr/share/nginx/html;
        index  index.html;

        # 关于 add_header 的一个经典坑：子级（location）里只要出现了任何一条 add_header，
        # 就不再继承父级（server/http）的所有 add_header。所以本文件只在 location 里写 add_header。

        # -----------------------------------------------------------------
        # REST API：/api/... → 后端副本
        # -----------------------------------------------------------------
        location /api/ {
            # proxy_pass 后面只写了 upstream 名、没写路径，请求的 URI 会原样转发（/api/robots → /api/robots）。
            # 如果写成 http://api_upstream/（多一个斜杠），Nginx 会把匹配到的 /api/ 前缀替换成 /，后端就收到 /robots 了
            proxy_pass http://api_upstream;

            # 默认情况下 Nginx 会把 Host 改成 “api_upstream”。这里改成浏览器原始的 Host（含端口，如 localhost:8080），
            # 后端生成重定向地址时才不会出错
            proxy_set_header Host              $http_host;
            # 后端看到的 TCP 对端永远是 Nginx，真实客户端 IP 要靠这几个头传过去
            proxy_set_header X-Real-IP         $remote_addr;
            # 在已有的 X-Forwarded-For 后面追加本次的客户端 IP（经过多层代理时形成一条链）
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # 原始协议（http / https），后端（uvicorn --proxy-headers）据此还原请求的 scheme
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;

            # 故障转移：连不上或超时（副本挂了、正在重启）时，把请求转给另一个副本再试一次。
            # 重要细节：POST 不是幂等方法，只要请求已经发到过一个副本，Nginx 默认就【不会】再转给下一个
            # （除非显式加 non_idempotent）——因为它无法确定第一个副本是不是已经执行了。
            # 所以下发命令的重试放在了前端，并带同一个 Idempotency-Key，由后端去重（见 src/api.ts）。
            # 为什么不把 http_502 / http_503 也列进来：列出的情况都会计入 max_fails。后端在依赖不健康时
            # 会返回 503（例如 RabbitMQ 挂了），两个副本会因此被一起摘除，Nginx 转而对所有请求直接返回 502，
            # 连本来能正常工作的只读接口也跟着不可用——把“某个依赖故障”放大成了“整站故障”。
            proxy_next_upstream error timeout;
            # 和后端建立 TCP 连接的超时（默认 60 s）。容器被停掉后它的 IP 不再应答，连接会一直挂到内核放弃
            # （实测要 20 多秒），故障转移就慢得像“卡死”。Docker 内网里正常建连不到 1 ms，2 s 已经非常宽裕
            proxy_connect_timeout 2s;

            # 在响应头里告诉浏览器“这次是哪个副本（IP:端口）回答的”，打开开发者工具就能看到负载均衡的效果。
            # always：即使是 4xx/5xx 响应也加上
            add_header X-Upstream $upstream_addr always;
        }

        # -----------------------------------------------------------------
        # WebSocket：/ws/dashboard（浏览器看板）和 /ws/robot（模拟器里的机器人）
        # -----------------------------------------------------------------
        location /ws/ {
            proxy_pass http://api_upstream;

            # WebSocket 的握手依赖 HTTP/1.1 的协议升级机制（101 Switching Protocols），
            # 而 Nginx 连后端默认用 HTTP/1.0，所以必须指定 1.1
            proxy_http_version 1.1;
            # 把升级请求“接力”给后端：Upgrade: websocket + Connection: upgrade（见上面的 map）
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;

            # 读/写超时：两次读（写）操作之间的最长间隔，不是连接总时长。默认 60 s——
            # 一条 60 s 内没有任何消息的 WebSocket 会被 Nginx 掐断。这里放宽到 1 小时；
            # 前端每 20 s 发一次 ping、机器人每秒发多条遥测，正常情况下远远到不了这个上限
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 握手阶段（还是普通的 HTTP GET）连不上某个副本时，按默认的 proxy_next_upstream（error timeout）
            # 换另一个副本重试；建连超时同 /api/，避免副本宕机后重连卡住二十几秒
            proxy_connect_timeout 2s;

            add_header X-Upstream $upstream_addr always;
            # 访问日志不记录查询参数（只用 $uri），见上面的 log_format ws；
            # 为什么查询参数里本来就没有长期有效的凭证，也见那里的说明
            access_log /var/log/nginx/access.log ws;
        }

        # Prometheus 的指标接口只在 Docker 内网里由 Prometheus 直接抓取（api-1:8000/metrics），
        # 不通过 Nginx 暴露给外部。显式返回 404，而不是落到下面的 SPA 兜底返回一个 index.html
        location = /metrics {
            return 404;
        }

        # Nginx 自身的存活探针（Dockerfile 的 HEALTHCHECK 用），不依赖后端，也不写访问日志
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # -----------------------------------------------------------------
        # 静态资源与缓存策略
        # -----------------------------------------------------------------

        # Vite 打包出来的 JS/CSS 都在 /assets/ 下，文件名里带内容哈希（例如 index-3f9a1c.js）：
        # 内容一变文件名就变，所以可以放心让浏览器缓存一年，且 immutable 表示“有效期内连校验都不用发”
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            # 找不到就 404：缺失的 JS 文件绝不能退回 index.html，否则浏览器会把 HTML 当 JS 执行并报一个很难懂的错
            try_files $uri =404;
        }

        # index.html 文件名固定、内容却会随每次发布而变（它引用了带新哈希的 JS），所以不能被缓存住：
        # no-cache 的意思不是“不缓存”，而是“每次用之前都先问服务器有没有变”（ETag 没变就回 304，几乎不耗流量）
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA 兜底：React 应用的页面都由前端 JS 渲染，服务器上并没有对应的文件。
        # 先找同名静态文件（如 /favicon.svg），找不到就内部跳转到 /index.html（进而命中上面的 no-cache 规则），
        # 交给前端处理。没有这一条，用户刷新任何非根路径都会得到 404
        location / {
            try_files $uri /index.html;
        }
    }
}
