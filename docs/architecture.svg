<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="title desc">
  <title id="title">robot-console runtime topology</title>
  <desc id="desc">Browser and simulated robots connect to Nginx, which serves the SPA and load-balances HTTP and WebSocket traffic across two FastAPI replicas. The replicas share PostgreSQL, Redis and RabbitMQ. Prometheus scrapes the replicas and RabbitMQ; Grafana reads Prometheus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e293b; }
      .box { stroke: #475569; stroke-width: 1.5; }
      .name { font-size: 17px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .label { font-size: 13px; fill: #334155; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .grouplabel { font-size: 12.5px; fill: #475569; font-weight: 600; }
      .caption { font-size: 13.5px; fill: #475569; }
    </style>
  </defs>

  <!-- solid background so the diagram reads on light and dark page themes -->
  <rect x="0" y="0" width="1080" height="640" fill="#ffffff"/>

  <!-- docker compose network -->
  <rect rx="10" class="group" x="270" y="30" width="790" height="570"/>
  <text class="grouplabel" x="284" y="52">docker compose network (project "robot-console")</text>

  <!-- clients -->
  <rect rx="8" class="box" x="12" y="140" width="160" height="90" fill="#f1f5f9"/>
  <text class="name" x="92" y="177" text-anchor="middle">Browser</text>
  <text class="sub" x="92" y="197" text-anchor="middle">dashboard (React SPA)</text>
  <text class="sub" x="92" y="214" text-anchor="middle">http://localhost:8080</text>

  <rect rx="8" class="box" x="310" y="340" width="180" height="80" fill="#f1f5f9"/>
  <text class="name" x="400" y="373" text-anchor="middle">Simulator</text>
  <text class="sub" x="400" y="393" text-anchor="middle">4 simulated robots</text>

  <!-- nginx -->
  <rect rx="8" class="box" x="310" y="110" width="180" height="150" fill="#dcfce7"/>
  <text class="name" x="400" y="138" text-anchor="middle">Nginx</text>
  <text class="sub" x="400" y="160" text-anchor="middle">host port 8080 (0.0.0.0)</text>
  <text class="sub" x="400" y="180" text-anchor="middle">static SPA</text>
  <text class="sub" x="400" y="198" text-anchor="middle">reverse proxy /api, /ws</text>
  <text class="sub" x="400" y="216" text-anchor="middle">load balancer (round robin)</text>
  <text class="sub" x="400" y="234" text-anchor="middle">WebSocket upgrade</text>

  <!-- API replicas -->
  <rect rx="10" class="group" x="590" y="70" width="190" height="300"/>
  <text class="grouplabel" x="685" y="94" text-anchor="middle">API replicas (FastAPI)</text>

  <rect rx="8" class="box" x="610" y="110" width="150" height="90" fill="#dbeafe"/>
  <text class="name" x="685" y="145" text-anchor="middle">api-1</text>
  <text class="sub" x="685" y="166" text-anchor="middle">uvicorn :8000</text>
  <text class="sub" x="685" y="184" text-anchor="middle">REST + WebSocket</text>

  <rect rx="8" class="box" x="610" y="240" width="150" height="90" fill="#dbeafe"/>
  <text class="name" x="685" y="275" text-anchor="middle">api-2</text>
  <text class="sub" x="685" y="296" text-anchor="middle">uvicorn :8000</text>
  <text class="sub" x="685" y="314" text-anchor="middle">REST + WebSocket</text>

  <!-- shared state -->
  <rect rx="8" class="box" x="900" y="80" width="150" height="72" fill="#fef3c7"/>
  <text class="name" x="975" y="110" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="975" y="132" text-anchor="middle">127.0.0.1:5432</text>

  <rect rx="8" class="box" x="900" y="190" width="150" height="72" fill="#fef3c7"/>
  <text class="name" x="975" y="220" text-anchor="middle">Redis</text>
  <text class="sub" x="975" y="242" text-anchor="middle">127.0.0.1:6379</text>

  <rect rx="8" class="box" x="900" y="300" width="150" height="72" fill="#fef3c7"/>
  <text class="name" x="975" y="330" text-anchor="middle">RabbitMQ</text>
  <text class="sub" x="975" y="352" text-anchor="middle">mgmt 127.0.0.1:15672</text>

  <!-- observability -->
  <rect rx="8" class="box" x="590" y="470" width="190" height="90" fill="#ffedd5"/>
  <text class="name" x="685" y="505" text-anchor="middle">Prometheus</text>
  <text class="sub" x="685" y="527" text-anchor="middle">127.0.0.1:9090</text>
  <text class="sub" x="685" y="545" text-anchor="middle">alert rules (alerts.yml)</text>

  <rect rx="8" class="box" x="310" y="470" width="180" height="90" fill="#ffedd5"/>
  <text class="name" x="400" y="505" text-anchor="middle">Grafana</text>
  <text class="sub" x="400" y="527" text-anchor="middle">127.0.0.1:3000</text>
  <text class="sub" x="400" y="545" text-anchor="middle">provisioned dashboard</text>

  <!-- edges: clients -> nginx -->
  <path class="edge" d="M 172 185 L 308 185"/>
  <text class="label" x="240" y="176" text-anchor="middle">HTTP /api</text>
  <text class="label" x="240" y="204" text-anchor="middle">WS /ws/dashboard</text>

  <path class="edge" d="M 400 340 L 400 262"/>
  <text class="label" x="410" y="305" text-anchor="start">WS /ws/robot</text>

  <!-- edge: nginx -> API replicas -->
  <path class="edge" d="M 490 185 L 588 185"/>
  <text class="label" x="539" y="176" text-anchor="middle">HTTP / WS</text>
  <text class="label" x="539" y="204" text-anchor="middle">round robin</text>

  <!-- edges: API replicas -> shared state -->
  <path class="edge" d="M 780 140 L 898 116"/>
  <text class="label" x="840" y="118" text-anchor="middle">SQL</text>

  <path class="edge" d="M 780 220 L 898 226"/>
  <text class="label" x="838" y="213" text-anchor="middle">cache + pub/sub</text>

  <path class="edge" d="M 780 300 L 898 336"/>
  <text class="label" x="838" y="334" text-anchor="middle">AMQP</text>

  <!-- edges: prometheus scrapes -->
  <path class="edge" d="M 685 470 L 685 372"/>
  <text class="label" x="694" y="424" text-anchor="start">scrape /metrics</text>

  <path class="edge" d="M 780 515 L 975 515 L 975 374"/>
  <text class="label" x="870" y="507" text-anchor="middle">scrape :15692</text>

  <!-- edge: grafana reads prometheus -->
  <path class="edge" d="M 490 515 L 588 515"/>
  <text class="label" x="539" y="506" text-anchor="middle">PromQL</text>

  <!-- caption -->
  <text class="caption" x="20" y="628">Only Nginx is published on all interfaces; databases and admin UIs bind to 127.0.0.1 on the host.</text>
</svg>
